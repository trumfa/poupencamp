name: Plànol nou

# Es dispara quan deixes un plànol nou a data/. No toca res del que hi ha publicat:
# només el compara amb data/recintes.csv i et deixa el resultat per descarregar.
#
#   1. A GitHub, obre la carpeta data/ i arrossega-hi el plànol (GeoJSON o el JSON
#      del DWG). Anomena'l data/planol-nou.geojson o data/planol-nou.json.
#   2. Espera un minut i entra a la pestanya Actions.
#   3. Descarrega «recintes»: hi trobaràs recintes.csv, geometria.json,
#      recintes.geojson i etiquetes.json. Les assignacions es conserven.
#   4. Puja els quatre fitxers a data/ (substituint els que hi ha) i esborra el
#      plànol nou. Els recintes que diguin NOU o CANVIAT els pots repassar a
#      recintes.html, que és qui torna a escriure data/recintes.csv.

on:
  push:
    paths:
      - 'data/planol-nou.geojson'
      - 'data/planol-nou.json'
  workflow_dispatch:

jobs:
  compara:
    name: Comparar amb data/recintes.csv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyproj

      - name: Baixar del full els noms de les unitats
        env:
          FULL: ${{ vars.POUPE_FULL }}
        run: |
          id="${FULL:-$(grep -oP "FULL = '\K[^']+" scripts/config.mjs)}"
          curl -sfL "https://docs.google.com/spreadsheets/d/$id/gviz/tq?tqx=out:csv&headers=1&sheet=unitats" \
            -o full-unitats.csv || echo "no s'ha pogut llegir unitats; es continua sense"

      - name: Comparar
        run: |
          f=$(ls data/planol-nou.geojson data/planol-nou.json 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "::error::No hi ha cap data/planol-nou.*"; exit 1; fi
          python scripts/planol-nou.py "$f" sortida/ data/recintes.csv full-unitats.csv | tee resum.txt

      - name: Avisar si hi ha res per revisar
        run: |
          n=$(grep -c -E ',(NOU|CANVIAT|DESAPAREGUT)$' sortida/recintes.csv || true)
          echo "### Plànol nou" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat resum.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$n" -gt 0 ]; then
            echo "**$n recintes per revisar.** Descarrega «recintes» aquí sota, puja els quatre fitxers a data/ i repassa a recintes.html els que diguin NOU o CANVIAT." >> $GITHUB_STEP_SUMMARY
          else
            echo "Cap canvi: el plànol dibuixa els mateixos recintes que ja hi ha a data/recintes.csv." >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: recintes
          path: sortida/
