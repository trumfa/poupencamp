<title>POUPE Encamp en clar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;1,400&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FFFFFF; --surface:#F6F7F4; --ink:#17211D; --ink-2:#4C5852; --ink-3:#78837D;
  --line:#E3E6DF; --line-2:#CBCFC6; --accent:#1F5C4A; --accent-soft:#E4EDE7;
  --warn:#8C4526; --warn-soft:#F4E7E0; --shadow:0 1px 2px rgba(23,33,29,.05);
  --pop:0 6px 24px rgba(23,33,29,.12);
  --f-display:'Petrona',Georgia,'Times New Roman',serif;
  --f-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121614; --surface:#191F1C; --ink:#E6EAE5; --ink-2:#A9B3AD; --ink-3:#7C8781;
    --line:#2A322E; --line-2:#3A433D; --accent:#7CC3A7; --accent-soft:#1D2A25;
    --warn:#E39774; --warn-soft:#2B211C; --shadow:0 1px 2px rgba(0,0,0,.3);
    --pop:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#121614; --surface:#191F1C; --ink:#E6EAE5; --ink-2:#A9B3AD; --ink-3:#7C8781;
  --line:#2A322E; --line-2:#3A433D; --accent:#7CC3A7; --accent-soft:#1D2A25;
  --warn:#E39774; --warn-soft:#2B211C; --shadow:0 1px 2px rgba(0,0,0,.3);
  --pop:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;
  line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:54px}
.brand{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.01em;
  text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:7px}
.brand small{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-weight:400}
.spacer{flex:1}
.esquema-enllac{margin-left:auto;flex:none;font-size:12.5px;color:var(--ink-2);text-decoration:none;
  border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;white-space:nowrap}
.esquema-enllac:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:520px){.esquema-enllac{display:none}}
.topline{min-height:50px;gap:10px}
.brand{flex:none}
.ubar-nom{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:2ch;flex:1 1 auto;
  padding-left:10px;border-left:1px solid var(--line-2)}
.chips{display:flex;gap:5px;flex:none;margin-left:auto}
.chips:empty{display:none}
.chips .chip{font-size:10px;padding:2px 6px}
.chips .chip.cls{background:transparent;border:1px solid var(--line-2);color:var(--ink-3)}
@media (max-width:400px){
  .brand small{display:none}
  .chips .chip.cls{display:none}
}

.uatop{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.uatop h1{margin:0;flex:1 1 12ch;min-width:0}
.uaacts{display:flex;flex-wrap:wrap;gap:7px;flex:none;padding-top:4px}
.nomes-imprimir{display:none}
.btn2{appearance:none;font:inherit;font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;
  display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:8px;cursor:pointer;
  text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.btn2:hover{border-color:var(--accent);color:var(--accent)}
.btn2.ple{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn2:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{padding:40px 0 20px}
.hero h1{font-family:var(--f-display);font-size:clamp(29px,6.6vw,42px);line-height:1.08;font-weight:600;
  letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);max-width:56ch;font-size:16.5px}

/* combobox */
.cb{position:relative;margin:26px 0 8px}
.cbfield{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line-2);
  border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.cbfield:focus-within{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.cb input{flex:1;min-width:0;font:inherit;font-size:16px;padding:13px 14px;color:var(--ink);
  background:transparent;border:0;outline:0}
.cb .toggle{appearance:none;border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  padding:0 14px;align-self:stretch;font-size:12px}
.cb .toggle:hover{color:var(--accent)}
.cblist{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:25;max-height:min(60vh,420px);
  overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:var(--pop);margin:0;padding:4px 0;list-style:none}
.cblist li{margin:0}
.cblist .grup{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);
  padding:8px 14px 3px;position:sticky;top:0;background:var(--surface)}
.cblist a{display:flex;align-items:center;gap:10px;padding:9px 14px;text-decoration:none;color:var(--ink);font-size:15px}
.cblist a:hover,.cblist a.on{background:var(--accent-soft);color:var(--accent)}
.cblist .buit{padding:14px;color:var(--ink-3);font-size:14px}
.cbcount{font-size:12.5px;color:var(--ink-3);margin:8px 0 0}
.chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.cblist a .chip{background:transparent;border:1px solid var(--line-2);color:var(--ink-3)}
.soon{margin:24px 0 0;padding:13px 15px;border:1px dashed var(--line-2);border-radius:10px;
  font-size:14px;color:var(--ink-2);display:flex;gap:11px;align-items:flex-start}
.soon svg{flex:none;margin-top:2px;color:var(--ink-3)}

/* el plànol */
.plan{margin:28px 0 0}
.plan .cap{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:10px}
.plan h2{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em;flex:none}
.plan .cap p{margin:0;font-size:13.5px;color:var(--ink-3);flex:1 1 24ch;min-width:0;max-width:72ch}
.planbox{position:relative;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;
  background:var(--surface);height:min(62vh,520px);touch-action:none}
.planbox canvas{display:block;width:100%;height:100%;cursor:grab}
.planbox canvas.arrossega{cursor:grabbing}
@media (min-width:900px){        /* el plànol se surt de la columna de text */
  .plan{position:relative;left:50%;transform:translateX(-50%);width:min(1280px,94vw)}
  .planbox{height:min(74vh,660px)}
}
.fons{position:absolute;left:10px;top:10px;display:flex;gap:0;border-radius:8px;overflow:hidden;
  border:1px solid var(--line-2);box-shadow:var(--shadow)}
.fons button{appearance:none;font:inherit;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;
  padding:6px 10px;border:0;border-left:1px solid var(--line-2);background:var(--paper);
  color:var(--ink-2);cursor:pointer}
.fons button:first-child{border-left:0}
.fons button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.fons button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.credit{position:absolute;left:10px;top:44px;margin:0;font-size:10px;line-height:1.3;color:var(--ink-3);
  background:color-mix(in srgb,var(--paper) 80%,transparent);padding:2px 6px;border-radius:4px;
  max-width:60%}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{appearance:none;width:34px;height:34px;border-radius:8px;cursor:pointer;font:inherit;
  font-size:16px;line-height:1;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-2);
  box-shadow:var(--shadow)}
.zoom button:hover{border-color:var(--accent);color:var(--accent)}
.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoom button.re{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em}
.llegenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.llegenda span{display:inline-flex;align-items:center;gap:6px}
.llegenda i{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid}
.plan .ajuda{margin-top:8px;font-size:12.5px;color:var(--ink-3)}

.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);
  text-decoration:none;padding:20px 0 0}
.back:hover{color:var(--accent)}
.uahead{padding:12px 0 4px}
.uahead h1{font-family:var(--f-display);font-size:clamp(27px,6.2vw,38px);line-height:1.1;font-weight:600;
  letter-spacing:-.02em;margin:0 0 13px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.fact{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px}
.fact b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.fact.clau{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.fact.clau b{color:var(--paper);letter-spacing:.06em}
.fact.clau i{font-style:normal;opacity:.75;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.lede{font-family:var(--f-display);font-size:17.5px;line-height:1.45;margin:0}
.lede p{margin:0 0 8px;max-width:60ch}
.notices{display:flex;flex-direction:column;gap:8px;margin:18px 0 4px}
.notice{display:flex;gap:10px;font-size:14px;line-height:1.5;padding:11px 13px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.notice.atencio{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--ink)}
.notice i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--warn);letter-spacing:.08em;
  text-transform:uppercase;flex:none;padding-top:2px}
.notice.info i{color:var(--ink-3)}

.picker{margin:0 0 18px;padding:14px 16px 15px;border:1.5px solid var(--accent);border-radius:12px;
  background:var(--surface)}
.parts{margin:0 0 16px;padding:13px 15px 14px;border:1.5px solid var(--warn);border-radius:12px;
  background:var(--warn-soft)}
.parts .flag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:var(--warn);
  padding:3px 8px;border-radius:999px;margin-bottom:8px}
.parts p{margin:0 0 11px;font-size:13.5px;color:var(--ink-2)}
.parts .tria{display:flex;flex-wrap:wrap;gap:7px}
.parts button{appearance:none;font:inherit;font-size:13.5px;padding:7px 13px;border-radius:999px;
  cursor:pointer;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-2);
  display:inline-flex;align-items:baseline;gap:7px}
.parts button b{font-weight:600}
.parts button small{font-family:var(--f-mono);font-size:10.5px;opacity:.75}
.parts button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.parts button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.picker .flag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:var(--accent);
  padding:3px 8px;border-radius:999px;margin-bottom:9px}
.picker h2{font-family:var(--f-display);font-size:18px;margin:0 0 3px;font-weight:600;letter-spacing:-.01em}
.picker p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.pgroup{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.pgroup:last-child{margin-bottom:0}
.plabel{font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);width:100%;margin-bottom:1px}
.pick{appearance:none;font:inherit;font-size:13.5px;padding:6px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-2);background:transparent;color:var(--ink-2)}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.picker .estat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;padding-top:11px;
  border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.picker .estat b{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.picker .neteja{appearance:none;font:inherit;font-size:12.5px;background:none;border:0;padding:0;
  cursor:pointer;color:var(--ink-3);text-decoration:underline;margin-left:auto}
.picker .neteja:hover{color:var(--accent)}

section.bloc{margin:32px 0 0}
.blochead{border-top:2px solid var(--ink);padding-top:10px;margin-bottom:2px}
.blochead h2{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.blochead p{margin:2px 0 0;font-size:13.5px;color:var(--ink-3)}
.point{padding:16px 0;border-bottom:1px solid var(--line)}
.point:last-child{border-bottom:0}
.ptop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.plab{font-size:13px;font-weight:600}
.pctx{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
.ptext{margin:0;font-size:16px;line-height:1.55}
.phelp{margin:5px 0 0;font-size:13.5px;color:var(--ink-3)}
.srcbtn{margin-top:9px;appearance:none;border:0;background:transparent;padding:0;cursor:pointer;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--accent);
  border-bottom:1px dotted currentColor}
.srcbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.src{margin-top:10px;padding:12px 14px;border-left:2px solid var(--accent);background:var(--surface);
  border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink-2)}
.src .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:4px}
.src q{font-family:var(--f-display);font-size:14.5px;line-height:1.5;color:var(--ink);quotes:'«' '»'}
.src .meta{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px}
.src .meta a{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;display:inline-block;margin-top:5px}

.claus{display:flex;flex-direction:column;gap:0;margin-top:4px}
.clau{padding:15px 0;border-bottom:1px solid var(--line)}
.clau:last-child{border-bottom:0}
.clau h3{margin:0 0 3px;font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.clau h3 .chip{font-weight:400}
.clau p{margin:0;font-size:15px;color:var(--ink-2);max-width:62ch}
.clau .art{margin-top:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}

figure.planol{margin:0 0 18px;padding:0}
figure.planol a{display:block;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
figure.planol img{display:block;width:100%;height:auto}
figure.planol figcaption{margin-top:7px;font-size:12.5px;color:var(--ink-3)}
.planolbox{padding:26px 18px;text-align:center}
.planolbox p{margin:0 0 12px;font-size:13.5px;color:var(--ink-3)}
.planolbox .btn{display:inline-block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;
  text-decoration:none;color:var(--paper);background:var(--accent);padding:9px 15px;border-radius:7px}

.dl{margin:6px 0 0;display:grid;grid-template-columns:minmax(130px,auto) 1fr}
.dl dt{font-size:12.5px;color:var(--ink-3);padding:11px 14px 11px 0;border-bottom:1px solid var(--line)}
.dl dd{margin:0;font-size:15px;padding:11px 0;border-bottom:1px solid var(--line)}
.dl dd b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.docs{list-style:none;margin:6px 0 0;padding:0}
.docs li{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.docs .v{font-family:var(--f-mono);font-size:11.5px;padding:3px 7px;border-radius:4px;flex:none;
  background:var(--accent-soft);color:var(--accent)}
.docs .v.old{background:transparent;color:var(--ink-3);border:1px solid var(--line-2)}
.docs .m{flex:1;min-width:0}
.docs .m b{display:block;font-size:14.5px;font-weight:600}
.docs .m span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.docs .m a{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;display:inline-block;margin-top:6px}
details.glos{margin:28px 0 0;border-top:1px solid var(--line);padding-top:14px}
details.glos summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none}
details.glos summary::-webkit-details-marker{display:none}
details.glos summary::before{content:'+ ';font-family:var(--f-mono);color:var(--ink-3)}
details.glos[open] summary::before{content:'− '}
footer{margin:40px 0 56px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
footer p{margin:0 0 6px;max-width:64ch}
[hidden]{display:none!important}
@media (max-width:520px){
  .dl{grid-template-columns:1fr}
  .dl dt{border-bottom:0;padding-bottom:0}
  .dl dd{padding-top:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  header.top,.back,.picker,.uaacts,details.glos summary{display:none!important}
  .nomes-imprimir{display:block;font-size:8.5pt;line-height:1.45;color:#444;margin:0 0 14px;
    padding-bottom:8px;border-bottom:1px solid #bbb}
  body{background:#fff;color:#000;font-size:11pt}
  .wrap{max-width:none;padding:0}
  a{color:#000;text-decoration:none}
  .point,.clau,.docs li{break-inside:avoid}
  section.bloc{break-inside:auto;margin-top:18px}
  .blochead{border-top:1.5px solid #000}
  .src{background:#f6f6f4;border-left:2px solid #666}
  figure.planol{max-width:16cm}
  details.glos{border-top:1px solid #999}
  details.glos[open]{display:block}
  footer{border-top:1px solid #999;font-size:9pt}
  @page{margin:16mm 14mm}
}
</style>

<header class="top">
  <div class="wrap topline">
    <a class="brand" href="#/">POUP <small>Encamp</small></a>
    <b class="ubar-nom" id="ubar-nom" hidden></b>
    <span class="chips" id="ubar-claus"></span>
    <a class="esquema-enllac" href="esquema.html">Qui regula què</a>
  </div>
</header>

<main id="app" class="wrap"></main>

<script id="dades" type="application/json">__DADES__</script>
<script>
function arrenca(D){
const app = document.getElementById('app');
const T = D.T, P = D.pool;
const S = v => (typeof v === 'number' ? (P[v] || '') : (v || ''));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nrm = s => (s||'').toLowerCase().normalize('NFD').replace(new RegExp('[\u0300-\u036f]','g'),'');
const CLS = {SUC:'Sòl urbà consolidat', SUCc:'Sòl urbà consolidat', SUNC:'Sòl urbà no consolidat',
             SUBLE:'Sòl urbanitzable', SNU:'Sòl no urbanitzable', SNUBLE:'Sòl no urbanitzable'};
const TIP = {'UA per subzona':'Ordenada per subzones','UA per zona':'Ordenada per zones',
             'UA definició volumètrica':'Definició volumètrica','àrea diferenciada':'Àrea diferenciada',
             'document normatiu':'Document normatiu'};
const COB = {'coeficient de zona':'Surt del coeficient de la zona',
             'coeficient de zona + sistema':'Surt del coeficient de la zona; una part és sòl de sistemes',
             'sostre assignat a la fitxa':'La fitxa l’assigna directament',
             'volumètric (nucli tradicional)':'Ve donat pel volum de l’edifici',
             'àrea diferenciada':'Règim propi d’àrea diferenciada',
             'només sistema: sense aprofitament privat':'No en genera: és sòl de sistemes',
             'a determinar pel tècnic':'L’ha de determinar el tècnic'};
const drivePdf = id => 'https://drive.google.com/file/d/' + id + '/view';
const driveImg = id => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1400';

let sel = {zona:'', subzona:'', variant:{}, part:0};
// Una unitat pot tenir dues fitxes vigents alhora, una per volum del pla: la part urbana
// i la de sòl no urbanitzable. Cada part té la seva superfície, els seus paràmetres i el
// seu plànol; la pàgina en mostra una i deixa triar.
const partDe = u => (u.parts || [])[Math.min(sel.part, (u.parts || []).length - 1)] || {};

/* ------------------------------------------------------------------- fitxa */
// Una clau pot tenir règims alternatius (la subzona 11: 11-A o 11B). Mentre l'usuari no en
// triï cap, val el primer, que és el règim general.
function regims(codi){ return (D.variants || {})[codi] || null; }
function regimActiu(codi){
  const r = regims(codi);
  if (!r) return codi;
  return r.includes(sel.variant[codi]) ? sel.variant[codi] : r[0];
}

function itemsDe(u){
  const P = partDe(u);
  const out = [], vist = new Set();
  const posa = (it) => {
    const k = it.b + '|' + it.et + '|' + (it.c || '');
    if (vist.has(k)) return; vist.add(k); out.push(it);
  };
  [[P.z, 'zona'], [P.sz, 'subzona']].forEach(([grup, niv]) => (grup || []).forEach(z => {
    const reg = regimActiu(z.c);
    const font = D.valors[reg] ? reg : (String(z.c).match(/^\d+/) || [''])[0];
    (D.valors[font] || []).forEach(v => {
      const pp = D.params[v.p]; if (!pp) return;
      posa({b: pp.b, o: pp.o, et: pp.et, aj: pp.aj, pl: v.pl, no: v.no, art: v.a,
            c: z.c, niv: niv, nomClau: (D.claus[reg] || D.claus[z.c] || {}).n || z.n});
    });
  }));
  (P.pr || []).forEach(it => posa({b: it.b, o: it.o, et: S(it.et), aj: S(it.aj), pl: S(it.pl),
    no: it.nk ? S((P.raw || {})[it.nk]) : '', art: it.art || '', c: it.c, niv: it.niv,
    nomClau: it.c ? ((D.claus[it.c] || {}).n || it.c) : 'Aquesta unitat', fitxa: true}));
  // si la fitxa ja dona l'alçada, no repetim el «ho diu la fitxa» de la subzona
  if (out.some(i => i.fitxa && i.et === 'Alçada màxima'))
    return out.filter(i => !(i.et === 'Alçada màxima' && i.niv === 'subzona'));
  return out;
}

function visible(it){
  if (it.niv === 'zona' && sel.zona && it.c !== sel.zona) return false;
  if (it.niv === 'subzona' && sel.subzona && it.c !== sel.subzona) return false;
  return true;
}

// Què s'està mostrant ara mateix, per deixar-ho escrit a la fitxa impresa.
function filtreActiu(u){
  const parts = [];
  if (sel.zona) parts.push('zona ' + ((D.claus[sel.zona] || {}).n || sel.zona));
  if (sel.subzona) parts.push('subzona ' + ((D.claus[sel.subzona] || {}).n || sel.subzona));
  const P = partDe(u);
  for (const z of [...(P.z || []), ...(P.sz || [])])
    if (regims(z.c)) parts.push((D.claus[regimActiu(z.c)] || {}).n || regimActiu(z.c));
  return parts.length ? 'Filtrada per: ' + parts.join(' · ')
                      : "Mostra tot el que afecta la unitat, sense filtrar per zona ni subzona.";
}

/* ------------------------------------------------------------------ el plànol
   La geometria ve del DWG cadastral, projectada a Web Mercator (els metres dels
   mapes de fons) i desada com a deltes entre vèrtexs perquè ocupi poc. */
const COLORS = {SUC:'#1F5C4A', SUCc:'#1F5C4A', SUNC:'#B45400', SUBLE:'#2E6E86',
                SNU:'#78837D', SNUBLE:'#78837D'};
const FONS = {
  orto: {u: z => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z.z}/${z.y}/${z.x}`,
         c: 'Imatges: Esri, Maxar, Earthstar Geographics', fosc: true, max: 19},
  mapa: {u: z => `https://tile.openstreetmap.org/${z.z}/${z.x}/${z.y}.png`,
         c: '© col·laboradors d\'OpenStreetMap', fosc: false, max: 19},
  cap:  null,
};
const MERCATOR = 20037508.342789244;
let PLA = null;

function muntaPla(){
  if (PLA || !D.mapa) return PLA;
  const desfes = d => {
    const p = new Float64Array(d.length);
    p[0] = d[0]; p[1] = d[1];
    for (let i = 2; i < d.length; i += 2){ p[i] = p[i-2] + d[i]; p[i+1] = p[i-1] + d[i+1]; }
    return p;
  };
  const caixa = p => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < p.length; i += 2){
      if (p[i] < x0) x0 = p[i]; if (p[i] > x1) x1 = p[i];
      if (p[i+1] < y0) y0 = p[i+1]; if (p[i+1] > y1) y1 = p[i+1];
    }
    return [x0, y0, x1, y1];
  };
  const nom = {}, cls = {};
  for (const u of D.ua){ nom[u.id] = u.n; cls[u.id] = S((u.parts[0] || {}).cls); }
  const ua = [];
  for (const id in D.mapa.ua)
    for (const anell of D.mapa.ua[id]){
      const p = desfes(anell);
      ua.push({id, n: nom[id] || id, c: COLORS[cls[id]] || COLORS.SNU, p, bb: caixa(p)});
    }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const u of ua){
    if (u.bb[0] < x0) x0 = u.bb[0]; if (u.bb[1] < y0) y0 = u.bb[1];
    if (u.bb[2] > x1) x1 = u.bb[2]; if (u.bb[3] > y1) y1 = u.bb[3];
  }
  // La parròquia té dos nuclis molt separats (la vall i el Pas de la Casa). La vista
  // inicial encaixa el que té més unitats; el botó TOT els ensenya tots dos.
  const cents = ua.map(u => [(u.bb[0] + u.bb[2]) / 2, u]).sort((a, b) => a[0] - b[0]);
  const grups = [[cents[0][1]]];
  for (let i = 1; i < cents.length; i++){
    if (cents[i][0] - cents[i-1][0] > 2500) grups.push([]);
    grups[grups.length - 1].push(cents[i][1]);
  }
  const gran = grups.reduce((a, b) => (b.length > a.length ? b : a), grups[0]);
  let n0 = Infinity, m0 = Infinity, n1 = -Infinity, m1 = -Infinity;
  for (const u of gran){
    if (u.bb[0] < n0) n0 = u.bb[0]; if (u.bb[1] < m0) m0 = u.bb[1];
    if (u.bb[2] > n1) n1 = u.bb[2]; if (u.bb[3] > m1) m1 = u.bb[3];
  }
  PLA = {ua, o: D.mapa.o, bb: [x0, y0, x1, y1], nucli: [n0, m0, n1, m1]};
  return PLA;
}

function dinsAnell(x, y, p){
  let dins = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2){
    const yi = p[i+1], yj = p[j+1];
    if ((yi > y) !== (yj > y) && x < (p[j] - p[i]) * (y - yi) / (yj - yi) + p[i]) dins = !dins;
  }
  return dins;
}

function arrencaPla(){
  const M = muntaPla();
  const cv = document.getElementById('plan-cv');
  if (!M || !cv) return;
  const ctx = cv.getContext('2d');
  const credit = document.getElementById('plan-credit');
  let escala = 1, cx = 0, cy = 0, sobre = null, w = 0, h = 0;
  // Amb ratolí, el nom surt en passar-hi per sobre i el clic obre la fitxa. Sense
  // ratolí no hi ha «passar per sobre»: el primer toc ensenya el nom i el segon obre.
  const ambRatoli = matchMedia('(hover: hover)').matches;
  let capa = localStorage.getItem('poupe-fons') || 'orto';

  /* ---- mosaics del mapa de fons */
  const rajoles = new Map();
  function rajola(z, x, y){
    const n = 1 << z;
    if (x < 0 || y < 0 || x >= n || y >= n) return null;
    const k = capa + '/' + z + '/' + x + '/' + y;
    if (rajoles.has(k)) return rajoles.get(k);
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => pinta();
    im.onerror = () => { im.fallat = true; };
    im.src = FONS[capa].u({z, x, y});
    rajoles.set(k, im);
    if (rajoles.size > 400) for (const vell of [...rajoles.keys()].slice(0, 120)) rajoles.delete(vell);
    return im;
  }
  function pintaFons(){
    const f = FONS[capa];
    if (!f) return;
    const z = Math.max(0, Math.min(f.max, Math.round(Math.log2(escala * 2 * MERCATOR / 256))));
    const n = 1 << z, mida = 2 * MERCATOR / n;            // metres per rajola
    const [X0, Y1] = aMon(0, 0), [X1, Y0] = aMon(w, h);   // cantonades del que es veu
    const tx0 = Math.floor((X0 + M.o[0] + MERCATOR) / mida);
    const tx1 = Math.floor((X1 + M.o[0] + MERCATOR) / mida);
    const ty0 = Math.floor((MERCATOR - (Y1 + M.o[1])) / mida);
    const ty1 = Math.floor((MERCATOR - (Y0 + M.o[1])) / mida);
    if ((tx1 - tx0 + 1) * (ty1 - ty0 + 1) > 200) return;  // massa: no val la pena
    for (let tx = tx0; tx <= tx1; tx++)
      for (let ty = ty0; ty <= ty1; ty++){
        const im = rajola(z, tx, ty);
        if (!im || !im.complete || im.fallat || !im.naturalWidth) continue;
        const X = tx * mida - MERCATOR - M.o[0], Y = MERCATOR - ty * mida - M.o[1];
        const [px, py] = aPant(X, Y);
        const costat = mida * escala;
        ctx.drawImage(im, px, py, costat + 1, costat + 1);
      }
  }

  function mida(){
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    w = r.width; h = r.height;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function encaixa(bb){
    const [x0, y0, x1, y1] = bb;
    escala = Math.min(w / Math.max(x1 - x0, 1), h / Math.max(y1 - y0, 1)) * 0.92;
    cx = (x0 + x1) / 2; cy = (y0 + y1) / 2;
  }
  const tot = () => encaixa(M.bb);
  const inici = () => encaixa(M.nucli);
  const aPant = (x, y) => [(x - cx) * escala + w / 2, h / 2 - (y - cy) * escala];
  const aMon = (px, py) => [(px - w / 2) / escala + cx, cy - (py - h / 2) / escala];

  function traça(p){
    ctx.beginPath();
    const [sx, sy] = aPant(p[0], p[1]);
    ctx.moveTo(sx, sy);
    for (let i = 2; i < p.length; i += 2){ const q = aPant(p[i], p[i+1]); ctx.lineTo(q[0], q[1]); }
    ctx.closePath();
  }
  const veu = bb => {
    const a = aPant(bb[0], bb[3]), b = aPant(bb[2], bb[1]);
    return b[0] > -40 && a[0] < w + 40 && b[1] > -40 && a[1] < h + 40;
  };

  let pendent = false;
  function pinta(){
    if (pendent) return;
    pendent = true;
    requestAnimationFrame(() => {
      pendent = false;
      const est = getComputedStyle(document.documentElement);
      const ambFons = !!FONS[capa];
      ctx.clearRect(0, 0, w, h);
      pintaFons();
      for (const u of M.ua){
        if (!veu(u.bb)) continue;
        traça(u.p);
        ctx.fillStyle = u.c + (u === sobre ? '73' : (ambFons ? '3A' : '2E'));
        ctx.fill();
        ctx.strokeStyle = u.c;
        ctx.lineWidth = u === sobre ? 2.4 : 1.1;
        ctx.stroke();
      }
      const fons = ambFons ? 'rgba(0,0,0,.65)' : (est.getPropertyValue('--paper').trim() || '#fff');
      const tinta = ambFons ? '#FFFFFF' : (est.getPropertyValue('--ink-2').trim() || '#333');
      if (escala > 0.8){                        // noms, quan hi caben
        ctx.font = "500 12px 'Public Sans', sans-serif";
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3; ctx.lineJoin = 'round';
        const posats = [];
        for (const u of M.ua){
          if (u === sobre || !veu(u.bb)) continue;
          if ((u.bb[2] - u.bb[0]) * escala < 80) continue;
          const [px, py] = aPant((u.bb[0] + u.bb[2]) / 2, (u.bb[1] + u.bb[3]) / 2);
          if (posats.some(q => Math.abs(q[0] - px) < 70 && Math.abs(q[1] - py) < 15)) continue;
          posats.push([px, py]);
          ctx.strokeStyle = fons; ctx.strokeText(u.n, px, py);
          ctx.fillStyle = tinta; ctx.fillText(u.n, px, py);
        }
      }
      if (sobre){                               // el nom de la unitat assenyalada
        const text = ambRatoli ? sobre.n : sobre.n + '  ›  obre la fitxa';
        const [px, py] = aPant((sobre.bb[0] + sobre.bb[2]) / 2, (sobre.bb[1] + sobre.bb[3]) / 2);
        ctx.font = "600 14px 'Public Sans', sans-serif";
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const am = ctx.measureText(text).width + 16;
        const x = Math.max(am / 2 + 4, Math.min(w - am / 2 - 4, px));
        const y = Math.max(16, Math.min(h - 12, py));
        ctx.fillStyle = ambFons ? 'rgba(0,0,0,.72)' : (est.getPropertyValue('--ink').trim() || '#000');
        ctx.beginPath();
        ctx.roundRect(x - am / 2, y - 12, am, 24, 6);
        ctx.fill();
        ctx.fillStyle = ambFons ? '#FFFFFF' : (est.getPropertyValue('--paper').trim() || '#fff');
        ctx.fillText(text, x, y);
      }
    });
  }

  function unitatA(x, y){
    for (const u of M.ua)
      if (x >= u.bb[0] && x <= u.bb[2] && y >= u.bb[1] && y <= u.bb[3] && dinsAnell(x, y, u.p)) return u;
    return null;
  }
  function trien(px, py, toc){
    const [x, y] = aMon(px, py);
    const u = unitatA(x, y);
    if (!u){ if (sobre){ sobre = null; pinta(); } return; }
    if (!toc || sobre === u) location.hash = '#/ua/' + encodeURIComponent(u.id);
    else { sobre = u; pinta(); }
  }

  /* ---- gestos */
  const punters = new Map();
  let arrossegant = false, mogut = 0, ultim = null, distIni = 0, escIni = 1;
  const limita = k => Math.max(0.02, Math.min(40, k));
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    punters.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (punters.size === 1){ arrossegant = true; mogut = 0; ultim = [e.offsetX, e.offsetY]; cv.classList.add('arrossega'); }
    else if (punters.size === 2){
      const [a, b] = [...punters.values()];
      distIni = Math.hypot(a[0] - b[0], a[1] - b[1]); escIni = escala;
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!punters.has(e.pointerId)){
      const [x, y] = aMon(e.offsetX, e.offsetY);
      const u = unitatA(x, y);
      if (u !== sobre){ sobre = u; cv.style.cursor = u ? 'pointer' : 'grab'; pinta(); }
      return;
    }
    punters.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (punters.size === 2){
      const [a, b] = [...punters.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (distIni > 0) escala = limita(escIni * d / distIni);
      pinta(); return;
    }
    if (!arrossegant) return;
    const dx = e.offsetX - ultim[0], dy = e.offsetY - ultim[1];
    mogut += Math.abs(dx) + Math.abs(dy);
    cx -= dx / escala; cy += dy / escala;
    ultim = [e.offsetX, e.offsetY];
    pinta();
  });
  function solta(e){
    punters.delete(e.pointerId);
    if (punters.size === 0){
      if (arrossegant && mogut < 6) trien(e.offsetX, e.offsetY, e.pointerType !== 'mouse' || !ambRatoli);
      arrossegant = false; cv.classList.remove('arrossega');
    }
  }
  cv.addEventListener('pointerup', solta);
  cv.addEventListener('pointercancel', solta);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const [mx, my] = aMon(e.offsetX, e.offsetY);
    escala = limita(escala * (e.deltaY < 0 ? 1.2 : 1 / 1.2));
    const [nx, ny] = aMon(e.offsetX, e.offsetY);
    cx += mx - nx; cy += my - ny;
    pinta();
  }, {passive: false});

  const puja = k => { escala = limita(escala * k); pinta(); };
  document.getElementById('plan-mes').addEventListener('click', () => puja(1.5));
  document.getElementById('plan-menys').addEventListener('click', () => puja(1 / 1.5));
  document.getElementById('plan-tot').addEventListener('click', () => { tot(); pinta(); });
  function posaCredit(){
    credit.textContent = FONS[capa] ? FONS[capa].c : '';
    credit.hidden = !FONS[capa];
  }
  for (const b of document.querySelectorAll('.fons button'))
    b.addEventListener('click', () => {
      capa = b.dataset.fons;
      try { localStorage.setItem('poupe-fons', capa); } catch (err) {}
      for (const o of document.querySelectorAll('.fons button'))
        o.setAttribute('aria-pressed', String(o.dataset.fons === capa));
      posaCredit(); pinta();
    });
  addEventListener('resize', () => { mida(); pinta(); }, {passive: true});

  for (const b of document.querySelectorAll('.fons button'))
    b.setAttribute('aria-pressed', String(b.dataset.fons === capa));
  posaCredit();
  mida(); inici(); pinta();
}

function vistaUA(id, mantenirScroll){
  const u = D.ua.find(x => x.id === id);
  if (!u){ location.hash = '#/'; return; }
  if (!mantenirScroll) sel.part = 0;
  const y = window.scrollY;
  document.title = u.n + ' · POUPE Encamp';
  barraUA(u);
  const P = partDe(u);
  const zs = P.z || [], szs = P.sz || [];
  const ambRegims = [...zs, ...szs].filter(z => regims(z.c));
  const calFiltre = (zs.length + szs.length) > 1;     // filtrar per zona/subzona només si n'hi ha més d'una
  const calSel = calFiltre || ambRegims.length > 0;
  let n = 0;

  const vigent = (u.fx || []).find(f => f.idf === P.idf)
              || (u.fx || []).find(f => f.vig) || (u.fx || [])[0];
  const planol = vigent && (vigent.idf || vigent.img) ? `
    <figure class="planol">
      <a href="${esc(vigent.idf ? 'planols/' + vigent.idf + '.webp' : drivePdf(vigent.img))}" target="_blank" rel="noopener">
        <img id="planol-img" src="planols/${esc(vigent.idf)}.webp" alt="Plànol de ${esc(u.n)}" loading="lazy">
      </a>
      <figcaption>${esc(T.planol_nota)}</figcaption>
    </figure>` : '';

  const pdfBopa = vigent && vigent.pdf ? drivePdf(vigent.pdf) : '';

  const clausHtml = `<div class="claus">${
    [...zs.map(z => [z, 'Zona']), ...szs.map(z => [z, 'Subzona'])].map(([z, tipus]) => {
      const c = D.claus[regimActiu(z.c)] || D.claus[z.c] || {};
      const a = D.arts[c.a] || null;
      return `<div class="clau">
        <h3>${esc(c.n || z.n || z.c)} <span class="chip">${esc(tipus)} ${esc(z.c)}</span></h3>
        ${c.f ? `<p>${esc(c.f)}</p>` : `<p>Clau ${esc(z.c)} del POUPE.</p>`}
        ${c.co ? `<p style="margin-top:5px">Coeficient d'edificabilitat: <b>${esc(c.co)}</b> m² de sostre per m² de terreny.</p>` : ''}
        ${c.a ? `<div class="art">${esc(c.a)}${a ? ' · ' + esc(a.t) : ''}${
          a && a.u ? ` — <a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(T.veure_article)} ↗</a>` : ''}</div>` : ''}
      </div>`;
    }).join('') || '<p style="color:var(--ink-3);font-size:15px">Aquesta unitat no té zones ni subzones assignades a la fitxa.</p>'}</div>`;

  const documents = `<ul class="docs">${(u.fx || []).map(f => `<li>
      <span class="v ${f.vig ? '' : 'old'}">${esc(f.m)}</span>
      <span class="m">
        <b>${f.vig ? 'Fitxa vigent' : 'Versió anterior'} · Volum ${esc(f.v)}</b>
        <span>${esc(S(f.fase))} — ${esc(S(f.b))}${f.pg ? ', pàg. ' + esc(f.pg) : ''}</span>
        ${f.pdf ? `<a href="${esc(drivePdf(f.pdf))}" target="_blank" rel="noopener">${esc(T.descarrega_pdf)} ↗</a>` : ''}
      </span></li>`).join('')}</ul>
    <p class="phelp" style="margin-top:12px">${esc(T.historic_nota)}</p>`;

  const tots = itemsDe(u);
  const items = tots.filter(visible);
  const filtrat = !!(sel.zona || sel.subzona);

  const selector = !calSel ? '' : `<div class="picker">
      <span class="flag">Tria una opció</span>
      <h2>${(zs.length + szs.length) > 1 ? 'La teva parcel·la, on és?' : 'Quin tipus et toca?'}</h2>
      <p>${(zs.length + szs.length) > 1
        ? "Aquesta unitat té més d'una zona o subzona, i no diuen el mateix. Tria la teva i la fitxa es quedarà només amb el que t'afecta."
        : "La fitxa no concreta de quin tipus és aquesta subzona. Tria el que et toca i la fitxa es quedarà només amb el que t'afecta."}</p>
      ${calFiltre && zs.length ? `<div class="pgroup"><span class="plabel">Zona</span>
        <button class="pick" data-t="zona" data-v="" aria-pressed="${!sel.zona}">Totes</button>
        ${zs.map(z => `<button class="pick" data-t="zona" data-v="${esc(z.c)}" aria-pressed="${sel.zona === z.c}">${esc((D.claus[z.c]||{}).n || z.n)}</button>`).join('')}</div>` : ''}
      ${calFiltre && szs.length ? `<div class="pgroup"><span class="plabel">Subzona</span>
        <button class="pick" data-t="subzona" data-v="" aria-pressed="${!sel.subzona}">Totes</button>
        ${szs.map(z => `<button class="pick" data-t="subzona" data-v="${esc(z.c)}" aria-pressed="${sel.subzona === z.c}">${esc((D.claus[z.c]||{}).n || z.n)}</button>`).join('')}</div>` : ''}
      ${ambRegims.map(z => `<div class="pgroup"><span class="plabel">Tipus de ${
        esc((D.claus[z.c]||{}).n || 'clau ' + z.c)}</span>
        ${regims(z.c).map(r => `<button class="pick" data-t="regim" data-mare="${esc(z.c)}" data-v="${esc(r)}" aria-pressed="${
          regimActiu(z.c) === r}">${esc((D.claus[r]||{}).n || r)}</button>`).join('')}</div>`).join('')}
      ${calFiltre ? `<p class="estat">
        <span>${filtrat
          ? `Es veuen <b>${items.length}</b> dels <b>${tots.length}</b> punts de la fitxa.`
          : `Ara es veuen els <b>${tots.length}</b> punts de la fitxa, de totes les zones i subzones.`}${
          zs.length > 1 && szs.length > 1 && !(sel.zona && sel.subzona)
            ? ' La zona i la subzona es trien per separat: cal marcar-ne una de cada per acabar d\'afinar.'
            : ''}</span>
        ${filtrat ? `<button type="button" class="neteja" id="plan-neteja">Treu els filtres</button>` : ''}
      </p>` : ''}
    </div>`;

  const cossos = D.blocs.map(b => {
    let cos;
    if (b.id === 'B1') return '';          // fos amb la capçalera de la fitxa
    else if (b.id === 'B15') cos = clausHtml;
    else if (b.id === 'B9') cos = documents;
    else {
      const its = items.filter(i => i.b === b.id).sort((x, y) => (x.o - y.o) || x.et.localeCompare(y.et));
      if (!its.length) return '';
      cos = its.map(it => punt(it, n++)).join('');
    }
    return `<section class="bloc"><div class="blochead"><h2>${esc(b.t)}</h2><p>${esc(b.s)}</p></div>${cos}</section>`;
  }).join('');

  app.innerHTML = `
    <a class="back" href="#/">← Totes les unitats</a>
    <div class="uahead">
      <div class="uatop">
        <h1>${esc(u.n)}</h1>
        <div class="uaacts">
          ${pdfBopa ? `<a class="btn2" href="${esc(pdfBopa)}" target="_blank" rel="noopener"
             >${esc(T.btn_fitxa_bopa || 'Fitxa del BOPA')} ↗</a>` : ''}
          <button class="btn2 ple" id="btn-imprimeix" type="button"
            title="S'obre el diàleg d'impressió: tria «Desa com a PDF»"
            >${esc(T.btn_fitxa_completa || 'Fitxa completa')} ↓</button>
        </div>
      </div>
      ${(u.parts || []).length > 1 ? `<div class="parts">
        <span class="flag">Aquesta unitat té ${u.parts.length} fitxes</span>
        <p>El pla la reparteix en ${u.parts.length} parts, cadascuna amb la seva classificació,
          la seva superfície i el seu plànol. Tria on és la teva parcel·la.</p>
        <div class="tria">${u.parts.map((pt, i) => `<button type="button" class="part" data-i="${i}"
          aria-pressed="${i === Math.min(sel.part, u.parts.length - 1)}"><b>${
          esc(CLS[S(pt.cls)] || S(pt.cls) || S(pt.np))}</b><small>${esc(pt.sup || '—')} m²</small></button>`).join('')}</div>
      </div>` : ''}
      <p class="nomes-imprimir">Fitxa generada el ${esc(ara())}${(u.parts || []).length > 1
        ? ' · part de ' + esc(CLS[S(P.cls)] || S(P.cls) || S(P.np)) : ''} · ${esc(filtreActiu(u))}<br>
        ${esc(T.avis_legal || '')} ${esc(T.avis_bopa || '')}</p>
      <div class="facts">
        ${P.clau ? `<span class="fact clau"><i>Clau</i><b>${esc(P.clau)}</b></span>` : ''}
        ${P.cls ? `<span class="fact">${esc(CLS[S(P.cls)] || S(P.cls))}</span>` : ''}
        ${P.sup ? `<span class="fact"><b>${esc(P.sup)}</b> m²</span>` : ''}
        <span class="fact">${esc(TIP[S(P.tf)] || S(P.tf) || TIP[S(u.tf)] || S(u.tf))}</span>
        ${P.cob ? `<span class="fact">${esc(COB[S(P.cob)] || S(P.cob))}</span>` : ''}
      </div>
      ${selector}
      ${planol}
      <div class="lede">${(P.res || []).map(S).filter(Boolean).map(r => `<p>${esc(r)}</p>`).join('')}</div>
      ${(P.av || []).length ? `<div class="notices">${P.av.map(a => `
        <div class="notice ${esc(a.to)}"><i>${a.to === 'atencio' ? 'Atenció' : 'Nota'}</i><span>${esc(S(a.x))}</span></div>`).join('')}</div>` : ''}
    </div>
    ${cossos}
    <details class="glos"><summary>Paraules que surten en aquesta pàgina</summary>
      <dl class="dl">${D.glossari.map(g => `<dt>${esc(g.t)}</dt><dd>${esc(g.d)}</dd>`).join('')}</dl>
    </details>
    <footer>
      <p><strong>${esc(T.avis_legal)}</strong></p>
      <p>${esc(T.avis_bopa)}</p>
      <p>${esc(T.peu_credits)}</p>
      <p><a href="esquema.html">Qui regula què</a> — quin nivell del pla decideix cada paràmetre,
        amb el text de l'article.</p>
    </footer>`;

  const pim = document.getElementById('planol-img');
  if (pim) pim.addEventListener('error', () => {
    const box = pim.parentNode.parentNode;
    const url = vigent && vigent.img ? drivePdf(vigent.img) : '';
    box.innerHTML = `<div class="planolbox"><p>${esc(url ? T.planol_error
      : (T.planol_cap || 'Aquesta fitxa no porta plànol.'))}</p>${
      url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Obrir el plànol ↗</a>` : ''}</div>
      <figcaption>${esc(T.planol_nota)}</figcaption>`;
  });
  app.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.t === 'regim') sel.variant[b.dataset.mare] = b.dataset.v;
    else sel[b.dataset.t] = b.dataset.v;
    vistaUA(id, true);
  }));
  app.querySelectorAll('.parts .part').forEach(b => b.addEventListener('click', () => {
    sel.part = Number(b.dataset.i);
    sel.zona = ''; sel.subzona = '';        // les zones són d'una part, no de l'altra
    vistaUA(id, true);
  }));

  const net = document.getElementById('plan-neteja');
  if (net) net.addEventListener('click', () => {
    sel.zona = ''; sel.subzona = '';
    vistaUA(id, true);
  });

  const imp = document.getElementById('btn-imprimeix');
  if (imp) imp.addEventListener('click', () => {
    const tancats = [...app.querySelectorAll('.src[hidden]')];
    const glos = app.querySelector('details.glos');
    const glosTancat = glos && !glos.open;
    tancats.forEach(p => { p.hidden = false; });
    if (glos) glos.open = true;
    const desfes = () => {
      tancats.forEach(p => { p.hidden = true; });
      if (glosTancat) glos.open = false;
      window.removeEventListener('afterprint', desfes);
    };
    window.addEventListener('afterprint', desfes);
    window.print();
    setTimeout(desfes, 3000);          // navegadors que no llancen afterprint
  });
  app.querySelectorAll('.srcbtn').forEach(b => b.addEventListener('click', () => {
    const p = document.getElementById('src-' + b.dataset.src);
    const obert = !p.hidden; p.hidden = obert; b.setAttribute('aria-expanded', String(!obert));
  }));
  if (mantenirScroll) window.scrollTo(0, y);
}

function ruta(){
  const m = (location.hash || '#/').match(/^#\/ua\/(.+)$/);
  if (m){ vistaUA(decodeURIComponent(m[1])); window.scrollTo(0, 0); }
  else { sel = {zona:'', subzona:'', variant:{}, part:0}; barraUA(null); vistaLlista(); window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', ruta);
ruta();
}

(function(){
  const el = document.getElementById('dades');
  const cru = el ? el.textContent.trim() : '';
  if (cru && cru !== '__DAD' + 'ES__') { arrenca(JSON.parse(cru)); return; }
  fetch('data.json').then(r => r.json()).then(arrenca).catch(() => {
    document.getElementById('app').innerHTML =
      '<p style="padding:40px 0;color:var(--ink-3)">No s\'han pogut carregar les dades.</p>';
  });
})();
</script>
