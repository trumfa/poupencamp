<style>

  --f-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121714; --surface:#1A211D; --ink:#E9EDE9; --ink-2:#AAB5AF; --ink-3:#7C8781;
    --line:#28312C; --line-2:#3A443E; --accent:#7FC0A6; --accent-soft:#173028;
    --falta:#E09B76; --falta-soft:#33221A; --fet:#7FC0A6;
    --avis:#E09B76; --avis-soft:#33221A;
  }
}
:root[data-theme="dark"]{
  --paper:#121714; --surface:#1A211D; --ink:#E9EDE9; --ink-2:#AAB5AF; --ink-3:#7C8781;
  --line:#28312C; --line-2:#3A443E; --accent:#7FC0A6; --accent-soft:#173028;
  --falta:#E09B76; --falta-soft:#33221A; --fet:#7FC0A6;

}

<script id="dades-recintes" type="application/json">__RECINTES__</script>
<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('dades-recintes').textContent);
const [OX, OY] = D.o;
const MERC = 20037508.342789244;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sensAcc = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const m2 = n => Math.round(n || 0).toLocaleString('ca-ES');
// Compte: les superfícies de les fitxes van a la catalana —«36.848» són trenta-sis mil—
// i les dels recintes les calcula el guió del plànol, amb el punt com a decimal: «1010.4».
const numFitxa = t => Number(String(t == null ? '' : t).replace(/\./g, '').replace(',', '.')) || 0;
const numRec = t => parseFloat(t) || 0;
const CLS = {SUC:'sòl urbà consolidat', SUCc:'sòl urbà consolidat', SUNC:'sòl urbà no consolidat',
             SUBLE:'sòl urbanitzable', SNU:'sòl no urbanitzable', SNUBLE:'sòl no urbanitzable'};

function punts(g){
  const p = []; let x = 0, y = 0;
  for (let i = 0; i < g.length; i += 2){ x += g[i]; y += g[i + 1]; p.push([x + OX, y + OY]); }
  return p;
}
const R = D.r.map(r => {
  const p = punts(r.g);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of p){ if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return { ...r, sn: numRec(r.s), p, bb: [x0, y0, x1, y1], cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
});
const U = D.u.slice().sort((a, b) => a.n.localeCompare(b.n, 'ca'));
const UNI = Object.fromEntries(U.map(u => [u.i, u]));
const NOM = u => (UNI[u] || {}).n || u;

// La feina es desa al navegador. No substitueix el full —el que mana és el full— però
// evita que tancar la pestanya per error s'emporti mitja tarda de feina.
const CLAU_DESAT = 'poupe-recintes-assignacions';
const assignat = {}, ordre = [];
try {
  const desat = JSON.parse(localStorage.getItem(CLAU_DESAT) || '[]');
  for (const [i, u] of desat) if (D.r.some(r => r.i === i && r.u !== u)){ assignat[i] = u; ordre.push(i); }
} catch (e) { /* sense desat, es comença de zero */ }
function desa(){
  try { localStorage.setItem(CLAU_DESAT, JSON.stringify(ordre.map(i => [i, assignat[i]]))); }
  catch (e) { /* si el navegador no deixa desar, tant se val: el full és el que compta */ }
}
const uaDe = r => assignat[r.i] || r.u;
const teUA = r => !!uaDe(r);
const recDe = idu => R.filter(r => uaDe(r) === idu);
const sumaDe = idu => recDe(idu).reduce((t, r) => t + r.sn, 0);
// quadra quan el que s'ha dibuixat i el que diu la fitxa s'assemblen
function estat(u){
  const rs = recDe(u.i), suma = rs.reduce((t, r) => t + r.sn, 0);
  if (!rs.length) return { k: 'sense', n: 0, suma: 0, falta: u.s };
  if (!u.s) return { k: 'sensesup', n: rs.length, suma, falta: 0 };
  const falta = u.s - suma;
  return { k: Math.abs(falta) / u.s < 0.1 ? 'ok' : 'desquadra', n: rs.length, suma, falta };
}

/* ------------------------------------------------------------ el plànol */
const lona = document.getElementById('lona');
const ctx = lona.getContext('2d');
let vista = { x: 0, y: 0, e: 1 }, selR = null, selU = null, sobre = null;
let ambFons = true, ambNoms = true;

const aPx = (x, y) => [x * vista.e + vista.x, -y * vista.e + vista.y];
const aMerc = (px, py) => [(px - vista.x) / vista.e, (vista.y - py) / vista.e];
function caixaDe(rs){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of rs){ x0 = Math.min(x0, r.bb[0]); y0 = Math.min(y0, r.bb[1]);
                       x1 = Math.max(x1, r.bb[2]); y1 = Math.max(y1, r.bb[3]); }
  return [x0, y0, x1, y1];
}
function encaixa(c, marge){
  const w = lona.clientWidth, h = lona.clientHeight;
  const m = marge == null ? 0.88 : marge;
  const e = Math.min(w / Math.max(c[2] - c[0], 30), h / Math.max(c[3] - c[1], 30)) * m;
  vista = { e, x: w / 2 - (c[0] + c[2]) / 2 * e, y: h / 2 + (c[1] + c[3]) / 2 * e };
  pinta();
}

const cau = new Map();
function mosaics(){
  if (!ambFons) return;
  const z = Math.max(0, Math.min(19, Math.round(Math.log2(vista.e * 2 * MERC / 256))));
  const n = 2 ** z, m = 2 * MERC / n, w = lona.clientWidth, h = lona.clientHeight;
  const i0 = Math.floor(((0 - vista.x) / vista.e + MERC) / m);
  const i1 = Math.floor(((w - vista.x) / vista.e + MERC) / m);
  const j0 = Math.floor((MERC - vista.y / vista.e) / m);
  const j1 = Math.floor((MERC - (vista.y - h) / vista.e) / m);
  for (let i = Math.max(0, i0); i <= Math.min(n - 1, i1); i++)
    for (let j = Math.max(0, j0); j <= Math.min(n - 1, j1); j++){
      const k = `${z}/${j}/${i}`;
      let im = cau.get(k);
      if (!im){
        im = new Image(); im.crossOrigin = 'anonymous';
        im.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${j}/${i}`;
        im.onload = () => pinta(); im.onerror = () => { im.mal = true; };
        cau.set(k, im);
      }
      if (im.complete && !im.mal && im.naturalWidth){
        const [px, py] = aPx(i * m - MERC, MERC - j * m);
        ctx.drawImage(im, px, py, m * vista.e + 1, m * vista.e + 1);
      }
    }
}

function traç(r){
  ctx.beginPath();
  for (let i = 0; i < r.p.length; i++){
    const [px, py] = aPx(r.p[i][0], r.p[i][1]);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function pinta(){
  const dpr = window.devicePixelRatio || 1, w = lona.clientWidth, h = lona.clientHeight;
  if (lona.width !== Math.round(w * dpr)){ lona.width = w * dpr; lona.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const est = getComputedStyle(document.documentElement);
  ctx.fillStyle = est.getPropertyValue('--surface').trim() || '#f6f7f4';
  ctx.fillRect(0, 0, w, h);
  mosaics();

  const cFalta = est.getPropertyValue('--falta').trim() || '#B45400';
  const cFet = est.getPropertyValue('--fet').trim() || '#1F5C4A';
  const delaUA = selU ? new Set(recDe(selU.i).map(r => r.i)) : null;

  for (const r of R){
    const pendent = !teUA(r);
    const destacat = r === selR || (delaUA && delaUA.has(r.i));
    traç(r);
    const c = pendent ? cFalta : cFet;
    ctx.fillStyle = c + (destacat ? '99' : r === sobre ? '66' : (ambFons ? '2A' : '22'));
    ctx.fill();
    ctx.strokeStyle = destacat ? c : c + (pendent ? 'CC' : '77');
    ctx.lineWidth = destacat ? 3 : (pendent ? 1.6 : 1);
    ctx.stroke();
  }

  if (ambNoms && vista.e > 0.004){
    ctx.font = '600 11px ' + (est.getPropertyValue('--f-mono').trim() || 'monospace');
    ctx.textAlign = 'center';
    for (const r of R){
      const [px, py] = aPx(r.cx, r.cy);
      if (px < -70 || py < -20 || px > w + 70 || py > h + 20) continue;
      const t = teUA(r) ? NOM(uaDe(r)) : r.i;
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = ambFons ? 'rgba(0,0,0,.7)' : (est.getPropertyValue('--paper').trim() || '#fff');
      ctx.strokeText(t, px, py);
      ctx.fillStyle = ambFons ? '#fff' : (est.getPropertyValue('--ink').trim() || '#000');
      ctx.fillText(t, px, py);
    }
  }
}

function dins(pt, poly){
  let a = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) a = !a;
  }
  return a;
}
function quin(px, py){
  const m = aMerc(px, py);
  let millor = null;
  for (const r of R){
    if (m[0] < r.bb[0] || m[0] > r.bb[2] || m[1] < r.bb[1] || m[1] > r.bb[3]) continue;
    if (!dins(m, r.p)) continue;
    const a = (r.bb[2] - r.bb[0]) * (r.bb[3] - r.bb[1]);
    if (!millor || a < millor.a) millor = { r, a };
  }
  return millor && millor.r;
}

/* ------------------------------------------------------------ llistes */
let pestanya = 'rec', filtre = 'falten', cerca = '';
const FILTRES = {
  rec: [['falten', 'Sense unitat'], ['assignats', 'Assignats'], ['tots', 'Tots']],
  uni: [['desquadra', 'No quadren'], ['sense', 'Sense recinte'], ['tots', 'Totes']],
};

function pintaFiltres(){
  document.getElementById('filtres').innerHTML = FILTRES[pestanya]
    .map(([k, t]) => `<button type="button" data-f="${k}" aria-pressed="${filtre === k}">${t}</button>`).join('');
  document.getElementById('q').placeholder = pestanya === 'rec'
    ? 'R0184, o el nom escrit a dins…' : 'nom de la unitat…';
}

function llista(){
  const c = sensAcc(cerca.trim());
  if (pestanya === 'rec'){
    let l = R.filter(r => filtre === 'tots' || (filtre === 'falten' ? !teUA(r) : teUA(r)));
    if (c) l = l.filter(r => sensAcc(r.i + ' ' + r.n + ' ' + NOM(uaDe(r))).includes(c));
    return l.map(r => {
      const u = uaDe(r);
      return `<button type="button" data-r="${esc(r.i)}" aria-current="${r === selR}">
        <span class="t">${esc(u ? NOM(u) : (r.n || '—'))}</span>
        <span class="id">${esc(r.i)}</span>
        <span class="s ${u ? '' : 'falta'}">${esc(r.c)} · ${m2(r.sn)} m²${
          u && r.n && sensAcc(r.n) !== sensAcc(NOM(u)) ? ' · hi diu «' + esc(r.n) + '»' : ''}</span>
      </button>`;
    }).join('') || '<p class="buit" style="padding:14px">Res per aquí.</p>';
  }
  let l = U.map(u => ({ u, e: estat(u) }));
  if (filtre === 'desquadra') l = l.filter(x => x.e.k === 'desquadra');
  else if (filtre === 'sense') l = l.filter(x => x.e.k === 'sense');
  if (c) l = l.filter(x => sensAcc(x.u.n + ' ' + x.u.i).includes(c));
  return l.map(({u, e}) => `<button type="button" data-u="${esc(u.i)}" aria-current="${selU === u}">
      <span class="t">${esc(u.n)}</span>
      <span class="id">${e.n ? e.n + (e.n === 1 ? ' recinte' : ' recintes') : '—'}</span>
      <span class="s ${e.k === 'ok' ? 'ok' : e.k === 'tots' ? '' : 'falta'}">${
        e.k === 'sense' ? (u.s ? 'la fitxa diu ' + m2(u.s) + ' m²' : 'sense superfície')
        : e.k === 'ok' ? m2(e.suma) + ' m² · quadra'
        : e.k === 'sensesup' ? m2(e.suma) + ' m² dibuixats'
        : m2(e.suma) + ' de ' + m2(u.s) + ' m² · ' + (e.falta > 0 ? 'en falten ' + m2(e.falta) : 'en sobren ' + m2(-e.falta))
      }</span></button>`).join('') || '<p class="buit" style="padding:14px">Res per aquí.</p>';
}

function pintaLlista(){
  const el = document.getElementById('files');
  el.innerHTML = llista();
  const n = el.querySelectorAll('button').length;
  document.getElementById('res').textContent = pestanya === 'rec'
    ? `${n} de ${R.length} recintes` : `${n} de ${U.length} unitats`;
  const act = el.querySelector('[aria-current="true"]');
  if (act) act.scrollIntoView({ block: 'nearest' });
}

/* ------------------------------------------------------------ detall */
let fitxaActiva = null;
function detall(){
  const el = document.getElementById('detall');
  let html = '';

  if (selR){
    const u = uaDe(selR);
    html += `<div class="card">
      <h2>${esc(selR.i)}</h2>
      <p class="sub">recinte del plànol</p>
      <dl class="dada">
        <dt>Capa</dt><dd>${esc(selR.c)}</dd>
        <dt>Superfície</dt><dd>${m2(selR.sn)} m²</dd>
        ${selR.n ? `<dt>Hi diu</dt><dd>${esc(selR.n)}</dd>` : ''}
        ${selR.a ? `<dt>Assignat</dt><dd>${esc(selR.a)}</dd>` : ''}
      </dl>
      ${u ? `<div class="fet"><b>${esc(NOM(u))}</b>${assignat[selR.i] ? ' <span style="opacity:.7">— assignat ara</span>' : ''}<br>
        <button type="button" id="veure-u">veure la unitat</button> ·
        <button type="button" id="canvia">canviar</button>${
        assignat[selR.i] ? ' · <button type="button" id="treu">desfer</button>' : ''}</div>`
      : '<p class="sensesuma">Aquest recinte encara no té unitat.</p>'}
      ${(!u || obrintTria) ? `<div class="tria">
        <input id="qua" type="search" autocomplete="off" placeholder="de quina unitat és?" value="${esc(cercaUA)}">
        <div class="suggeriments">${suggeriments()}</div></div>` : ''}
    </div>`;
  }

  if (selU){
    const e = estat(selU), rs = recDe(selU.i);
    html += `<div class="card">
      <h2>${esc(selU.n)}</h2>
      <p class="sub">${esc(selU.i)}</p>
      <dl class="dada">
        ${selU.c ? `<dt>Classificació</dt><dd>${esc(CLS[selU.c] || selU.c)}</dd>` : ''}
        ${selU.s ? `<dt>Superfície</dt><dd>${m2(selU.s)} m²</dd>` : ''}
        ${selU.k ? `<dt>Claus</dt><dd>${esc(selU.k)}</dd>` : ''}
        ${selU.t ? `<dt>Tipus</dt><dd>${esc(selU.t)}</dd>` : ''}
      </dl>
      <div class="suma ${e.k === 'ok' || e.k === 'sensesup' ? '' : 'falta'}">
        ${e.n ? `<b>${e.n}</b> recinte${e.n === 1 ? '' : 's'} · <b>${m2(e.suma)}</b> m² dibuixats`
              : 'Cap recinte assignat'}
        ${selU.s && e.n ? (e.k === 'ok' ? ' · quadra amb la fitxa ✓'
            : `<br>la fitxa en diu ${m2(selU.s)}: ${e.falta > 0 ? 'en falten <b>' + m2(e.falta) + '</b>' : 'en sobren <b>' + m2(-e.falta) + '</b>'}`) : ''}
      </div>
      ${rs.length ? `<div class="mini">${rs.map(r => `<button type="button" data-r="${esc(r.i)}">
        <span class="id">${esc(r.i)}</span><span>${esc(r.c)}</span>
        <span class="m2">${m2(r.sn)} m²</span></button>`).join('')}</div>` : ''}
    </div>`;

    // el plànol de la fitxa: és el que et diu quina forma té la unitat
    const fs = selU.f || [];
    if (!fitxaActiva || !fs.some(f => f.id === fitxaActiva)) fitxaActiva = (fs[0] || {}).id;
    const f = fs.find(x => x.id === fitxaActiva);
    html += `<div class="card fitxa">
      <h2>El plànol de la fitxa</h2>
      <p class="sub">${fs.length ? esc(fitxaActiva) : 'aquesta unitat no té cap fitxa vigent'}</p>
      ${fs.length > 1 ? `<div class="tabs">${fs.map(x => `<button type="button" data-f="${esc(x.id)}"
        aria-pressed="${x.id === fitxaActiva}">Volum ${esc(x.v)}</button>`).join('')}</div>` : ''}
      ${f ? `<div class="capsa"><img id="planol-fitxa" src="planols/${encodeURIComponent(f.id)}.webp"
          alt="Plànol de la fitxa ${esc(f.id)}" loading="lazy"></div>
        <p class="peu">
          <span>${esc(f.c || '')}${f.s ? ' · ' + esc(f.s) + ' m²' : ''}</span>
          <a href="planols/${encodeURIComponent(f.id)}.webp" target="_blank" rel="noopener">obrir a mida completa ↗</a>
        </p>` : '<p class="nofoto">Sense plànol.</p>'}
    </div>`;
  }

  if (!selR && !selU) html += `<div class="card"><h2>Tria'n un</h2>
    <p class="buit">Clica un recinte al plànol, o una fila de la llista. A la pestanya
    <b>Unitats</b> hi tens totes les unitats amb els seus recintes i el plànol de la fitxa.</p></div>`;

  html += `<div class="card sortida"><h2>Per al full</h2>
    <p>Enganxa-ho a la columna <code>id_ua</code> de la pestanya recintes.</p>
    <textarea id="sortida" readonly placeholder="Encara no has assignat res."></textarea>
    <div class="accions">
      <button type="button" class="ple" id="copia">Copiar</button>
      <button type="button" id="desfes">Desfer l'últim</button>
      ${ordre.length ? '<button type="button" id="buida">Descartar-ho tot</button>' : ''}
      <span id="compte"></span>
    </div></div>`;

  el.innerHTML = html;
  sortida();
  const q = document.getElementById('qua');
  if (q && document.activeElement !== q){ q.focus({preventScroll:true}); q.setSelectionRange(q.value.length, q.value.length); }
}

let cercaUA = '', obrintTria = false;
function suggeriments(){
  const c = sensAcc(cercaUA.trim());
  let l = U.filter(u => !c || sensAcc(u.n).includes(c));
  l.sort((a, b) => sensAcc(a.n).indexOf(c) - sensAcc(b.n).indexOf(c) || a.n.localeCompare(b.n, 'ca'));
  return l.slice(0, 40).map(u => {
    const e = estat(u);
    let nota = e.n ? `${e.n} recinte${e.n === 1 ? '' : 's'}` : (u.s ? `la fitxa diu ${m2(u.s)} m²` : u.i);
    if (e.n && u.s) nota += e.k === 'ok' ? ' · ja quadra'
      : (e.falta > 0 ? ` · li falten ${m2(e.falta)} m²` : ` · ja li'n sobren ${m2(-e.falta)}`);
    const quadraria = selR && u.s && e.falta > 0 && Math.abs(e.falta - selR.sn) / u.s < 0.1;
    return `<button type="button" data-ua="${esc(u.i)}"${quadraria ? ' style="background:var(--accent-soft)"' : ''}
      >${esc(u.n)}<small>${esc(nota)}${quadraria ? ' · amb aquest quadraria' : ''}</small></button>`;
  }).join('') || '<p class="buit" style="padding:11px">Cap unitat es diu així.</p>';
}

function sortida(){
  const t = document.getElementById('sortida');
  if (!t) return;
  t.value = ordre.map(i => `${i},${assignat[i]}`).join('\n');
  document.getElementById('compte').textContent = ordre.length
    ? `${ordre.length} ${ordre.length === 1 ? 'assignat' : 'assignats'} · desat en aquest navegador`
    : '';
  const falten = R.filter(r => !teUA(r)).length;
  const mal = U.filter(u => estat(u).k === 'desquadra').length;
  document.getElementById('estat').innerHTML =
    `<span class="pastilla ${falten ? 'falta' : ''}">${falten ? falten + ' recintes sense unitat' : 'tots assignats'}</span>`
    + `<span class="pastilla">${mal} unitats no quadren</span>`
    + `<span class="pastilla">${R.length} recintes · ${U.length} unitats</span>`;
}

function mostraRecinte(r, zoom){
  if (r !== selR) obrintTria = false;
  selR = r; selU = UNI[uaDe(r)] || null; cercaUA = '';
  if (zoom){
    const m = Math.max((r.bb[2] - r.bb[0]), (r.bb[3] - r.bb[1])) * 0.6 + 40;
    encaixa([r.bb[0] - m, r.bb[1] - m, r.bb[2] + m, r.bb[3] + m], 1);
  }
  detall(); pintaLlista(); pinta();
}
function mostraUnitat(u, zoom){
  selU = u; selR = null; fitxaActiva = null;
  const rs = recDe(u.i);
  if (zoom && rs.length){
    const c = caixaDe(rs);
    const m = Math.max(c[2] - c[0], c[3] - c[1]) * 0.35 + 40;
    encaixa([c[0] - m, c[1] - m, c[2] + m, c[3] + m], 1);
  }
  detall(); pintaLlista(); pinta();
}

/* ------------------------------------------------------------ events */
let arros = null, mogut = false;
lona.addEventListener('pointerdown', e => {
  lona.setPointerCapture(e.pointerId);
  arros = { x: e.offsetX, y: e.offsetY, vx: vista.x, vy: vista.y }; mogut = false;
});
lona.addEventListener('pointermove', e => {
  if (arros){
    const dx = e.offsetX - arros.x, dy = e.offsetY - arros.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) mogut = true;
    vista.x = arros.vx + dx; vista.y = arros.vy + dy; pinta(); return;
  }
  const r = quin(e.offsetX, e.offsetY);
  if (r !== sobre){ sobre = r; lona.style.cursor = r ? 'pointer' : 'crosshair'; pinta(); }
});
lona.addEventListener('pointerup', e => {
  arros = null;
  if (mogut) return;
  const r = quin(e.offsetX, e.offsetY);
  if (r) mostraRecinte(r, false);
});
lona.addEventListener('wheel', e => {
  e.preventDefault();
  const m = aMerc(e.offsetX, e.offsetY);
  vista.e *= Math.exp(-e.deltaY * 0.0016);
  vista.x = e.offsetX - m[0] * vista.e; vista.y = e.offsetY + m[1] * vista.e;
  pinta();
}, { passive: false });

document.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 't-rec' || t.id === 't-uni'){
    pestanya = t.id === 't-rec' ? 'rec' : 'uni';
    filtre = FILTRES[pestanya][0][0]; cerca = '';
    document.getElementById('q').value = '';
    document.getElementById('t-rec').setAttribute('aria-selected', pestanya === 'rec');
    document.getElementById('t-uni').setAttribute('aria-selected', pestanya === 'uni');
    pintaFiltres(); pintaLlista(); return;
  }
  const f = t.closest('[data-f]');
  if (f && f.parentElement.id === 'filtres'){
    filtre = f.dataset.f; pintaFiltres(); pintaLlista(); return;
  }
  if (f && f.closest('.fitxa')){ fitxaActiva = f.dataset.f; detall(); return; }

  const br = t.closest('[data-r]');
  if (br){ mostraRecinte(R.find(x => x.i === br.dataset.r), true); return; }
  const bu = t.closest('[data-u]');
  if (bu){ mostraUnitat(UNI[bu.dataset.u], true); return; }
  const ua = t.closest('[data-ua]');
  if (ua && selR){
    assignat[selR.i] = ua.dataset.ua;
    if (!ordre.includes(selR.i)) ordre.push(selR.i);
    obrintTria = false; desa();
    mostraRecinte(selR, false); return;
  }
  if (t.id === 'canvia'){ obrintTria = true; cercaUA = ''; detall(); return; }
  if (t.id === 'veure-u'){ mostraUnitat(UNI[uaDe(selR)], true); return; }
  if (t.id === 'treu'){
    delete assignat[selR.i];
    const i = ordre.indexOf(selR.i); if (i >= 0) ordre.splice(i, 1);
    obrintTria = false; desa();
    mostraRecinte(selR, false); return;
  }
  if (t.id === 'buida'){
    if (!confirm('Segur que vols descartar les ' + ordre.length + ' assignacions d\'aquesta sessió?')) return;
    for (const i of ordre.slice()) delete assignat[i];
    ordre.length = 0; obrintTria = false; desa();
    detall(); pintaLlista(); pinta(); return;
  }
  if (t.id === 'b-fons'){ ambFons = !ambFons; t.setAttribute('aria-pressed', ambFons);
    document.getElementById('credit').style.visibility = ambFons ? '' : 'hidden'; pinta(); }
  if (t.id === 'b-noms'){ ambNoms = !ambNoms; t.setAttribute('aria-pressed', ambNoms); pinta(); }
  if (t.id === 'b-encaixa'){ encaixa(caixaDe(R)); }
  if (t.id === 'desfes' && ordre.length){
    const i = ordre.pop(); delete assignat[i]; desa();
    detall(); pintaLlista(); pinta();
  }
  if (t.id === 'copia'){
    const s = document.getElementById('sortida');
    s.select();
    try { document.execCommand('copy'); } catch (err) {}
    t.textContent = 'Copiat'; setTimeout(() => { t.textContent = 'Copiar'; }, 1500);
  }
  if (t.id === 'planol-fitxa'){
    const d = document.getElementById('lupa');
    d.querySelector('img').src = t.src; d.showModal();
  }
  if (t.classList.contains('tanca')) document.getElementById('lupa').close();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ cerca = e.target.value; pintaLlista(); }
  if (e.target.id === 'qua'){
    cercaUA = e.target.value;
    document.querySelector('.suggeriments').innerHTML = suggeriments();
  }
});
document.addEventListener('error', e => {
  if (e.target.id === 'planol-fitxa'){
    e.target.parentElement.innerHTML =
      '<p class="nofoto">El plànol de la fitxa només es veu a la web desplegada, '
      + 'on hi ha la carpeta planols/.</p>';
  }
}, true);
window.addEventListener('resize', pinta);

pintaFiltres(); pintaLlista(); detall();
const falten0 = R.filter(r => !teUA(r));
encaixa(caixaDe(falten0.length ? falten0 : R));
})();
</script>
